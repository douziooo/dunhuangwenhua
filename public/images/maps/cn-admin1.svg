<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6ea" />
      <stop offset="1" stop-color="#fffdf9" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(92,62,42,0.10)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1000" height="780" fill="url(#bg)" />
  <rect x="0" y="0" width="1000" height="780" fill="url(#grid)" />

  <rect x="40" y="40" width="920" height="700" rx="18" fill="rgba(255,244,232,0.35)" stroke="rgba(92,62,42,0.22)" stroke-width="2" />

  <text x="500" y="365" text-anchor="middle" font-size="26" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="rgba(92,62,42,0.78)">
    中国地图资源未加载（已切换为本地占位图）
  </text>
  <text x="500" y="405" text-anchor="middle" font-size="18" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="rgba(92,62,42,0.65)">
    请将省界 SVG 保存为 public/images/maps/cn-admin1.svg
  </text>
</svg>
