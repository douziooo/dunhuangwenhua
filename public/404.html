<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敦煌文化</title>
    <script>
        // GitHub Pages SPA fallback - preserve the current route
        (function() {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;
            var basePath = '/dunhuangwenhua/';
            // Extract the sub-path after /dunhuangwenhua/
            var subPath = path.substring(basePath.length - 1);
            if (subPath === '' || subPath === '/') subPath = '/';
            var redirectParam = encodeURIComponent(subPath + search + hash);
            window.location.replace(basePath + '?redirect=' + redirectParam);
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
